[pytest]
testpaths = tests
pythonpath = tests
bdd_features_base_dir = tests/features
markers =
    mvp: pruebas incluidas en la versión mínima
    h1: carga y validación
    h2: temperatura inia y calendario
    h3: detección
    h4: sustitución
    h5: salidas
    h6: comparación de métodos
    humo: verificación de la infraestructura de pruebas
    integracion: criterios de éxito, más lentas
    datos_reales: requieren inia.sqlite real (no corren en CI)
addopts = -ra --strict-markers -m "not datos_reales"
filterwarnings =
    ignore::DeprecationWarning:pytest_bdd.*
